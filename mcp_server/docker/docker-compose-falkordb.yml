# Runs the published images. The config file is the one inside the image
# (CONFIG_PATH). To build locally and mount ../config/config-docker-falkordb.yaml:
#   docker compose -f docker-compose-falkordb.yml -f docker-compose-falkordb.build.yml up --build
services:
  falkordb:
    # Pinned. 6.x can't load data written by 4.x ("effects buffer is version 2, this build
    # reads 3"): moving between major lines needs a fresh volume or a data migration.
    image: falkordb/falkordb:6.0.4
    restart: unless-stopped
    labels:
      # Databases are updated by hand, never by Watchtower
      - "com.centurylinklabs.watchtower.enable=false"
    ports:
      - "${DB_BIND_ADDRESS:-127.0.0.1}:${FALKORDB_HOST_PORT:-6379}:6379" # Redis/FalkorDB port
      - "${DB_UI_BIND_ADDRESS:-127.0.0.1}:${FALKORDB_BROWSER_HOST_PORT:-3000}:3000" # FalkorDB web UI
    environment:
      - BROWSER=${BROWSER:-1}  # Enable FalkorDB Browser UI (set to 0 to disable)
      # Append-only file: every write is logged, so a hard stop loses at most ~1s.
      # The image ignores FALKORDB_PASSWORD; its run.sh only passes REDIS_ARGS to redis-server,
      # so a set FALKORDB_PASSWORD becomes --requirepass here (also protects the Browser UI login).
      - REDIS_ARGS=${REDIS_ARGS:---appendonly yes}${FALKORDB_PASSWORD:+ --requirepass ${FALKORDB_PASSWORD}}
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    healthcheck:
      # PONG without a password, NOAUTH with one: both mean the server is up.
      test: ["CMD-SHELL", "redis-cli -p 6379 ping | grep -qE 'PONG|NOAUTH'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  graphiti-mcp:
    # To use the latest graphiti-core, build locally with:
    #   docker compose -f docker-compose-falkordb.yml -f docker-compose-falkordb.build.yml build
    # The Docker Hub image may lag behind the latest release.
    image: zepai/knowledge-graph-mcp:standalone
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    depends_on:
      falkordb:
        condition: service_healthy
    environment:
      # Database configuration
      - FALKORDB_URI=${FALKORDB_URI:-redis://falkordb:6379}
      - FALKORDB_PASSWORD=${FALKORDB_PASSWORD:-}
      - FALKORDB_DATABASE=${FALKORDB_DATABASE:-default_db}
      # Application configuration
      - GRAPHITI_GROUP_ID=${GRAPHITI_GROUP_ID:-main}
      - SEMAPHORE_LIMIT=${SEMAPHORE_LIMIT:-10}
      - CONFIG_PATH=${CONFIG_PATH:-/app/mcp/config/config-docker-falkordb.yaml}
      # Provider credentials and model settings. Bare names pass the value through
      # only when it is set (shell, .env, or the Portainer/Coolify stack env), so an
      # unset variable keeps the default from the config file.
      - OPENAI_API_KEY
      - OPENAI_API_URL
      - OPENAI_ORGANIZATION_ID
      - ANTHROPIC_API_KEY
      - GOOGLE_API_KEY
      - GROQ_API_KEY
      - VOYAGE_API_KEY
      - AZURE_OPENAI_API_KEY
      - AZURE_OPENAI_ENDPOINT
      - AZURE_OPENAI_DEPLOYMENT
      - AZURE_OPENAI_EMBEDDINGS_ENDPOINT
      - AZURE_OPENAI_EMBEDDINGS_DEPLOYMENT
      - MODEL_NAME
      - EMBEDDER_MODEL
      - LLM__PROVIDER
      - EMBEDDER__PROVIDER
      - GRAPHITI_TELEMETRY_ENABLED
    ports:
      - "${MCP_BIND_ADDRESS:-127.0.0.1}:${MCP_HOST_PORT:-8000}:8000" # Expose the MCP server via HTTP transport
    command: ["uv", "run", "main.py"]

volumes:
  falkordb_data:
    driver: local
